name: Refresh NBA Data

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package
        run: pip install -e .

      - name: Compute rolling window
        id: window
        run: |
          echo "start=$(date -u -d '60 days ago' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "end=$(date -u -d '14 days' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch schedule/box scores, refresh hub caches, retrain
        run: |
          python -m nba_predictor.pipeline.ingest \
            --start "${{ steps.window.outputs.start }}" \
            --end "${{ steps.window.outputs.end }}" \
            --skip-predictions

      - name: Regenerate public snapshot
        run: python -m nba_predictor.public_snapshot

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cache/schedule/games.json data/cache/hub/*.json \
                  models/*.pkl models/manifest.json models/manifest_history.jsonl \
                  data/public_snapshot.json
          git diff --staged --quiet || git commit -m "chore: refresh NBA data and retrain"
          git push
