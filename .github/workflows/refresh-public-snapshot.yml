name: Refresh Public Snapshot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install package
        run: pip install -e .

      - name: Regenerate public snapshot
        env:
          # The picks live in the VPS tracking DB (CI has none): the history is fetched from the live API.
          PICKS_API: https://nba.40-160-91-131.sslip.io
        run: python -m nba_predictor.public_snapshot

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public_snapshot.json data/picks_history.jsonl.gz
          git diff --staged --quiet || git commit -m "chore: refresh public snapshot"
          for i in 1 2 3 4; do
            git pull --rebase -q -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          echo "push kept losing the race" >&2; exit 1
