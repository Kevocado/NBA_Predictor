name: tests

# Added because NBA had none. `deploy-azure.yml`, `refresh-data.yml` and
# `refresh-public-snapshot.yml` install the package and run scripts; not one of
# them invoked pytest, so the suite here ran only when a person ran it. That is
# how PR #32 was able to report "no checks reported on the branch" while changing
# the application's startup path — a green-looking PR with nothing behind it.
#
# The same gap existed in the hub and was closed the same way (see
# predictor-hub/.github/workflows/tests.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # 30, not 15. The suite has outgrown the old budget and no single test is
    # responsible: locally the whole suite runs in about 2m35s with nothing
    # above 18s, but a GitHub-hosted runner is roughly 5x slower, which put the
    # run at 15m+ and killed it twice at exactly the 15-minute mark (#52). The
    # suite reached 71% both times with no failures. A timeout that fires on a
    # green suite is a false red that hides real failures behind it, so the
    # budget is raised rather than the suite trimmed to fit an arbitrary clock.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.13, because that is what `requires-python = ">=3.13"` asks for and
          # what the Dockerfile's `python:3.13-slim` serves. A gate on any other
          # interpreter would be testing a runtime nothing deploys.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        # No network-marked deselection: NBA's suite has no `network` marker
        # (grep finds none), so `pytest tests/` is the whole of it. If a
        # metered-upstream test is ever added it must be marked and deselected
        # here, the way NFL's workflow does — otherwise CI starts depending on
        # that upstream being up.
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/ -q

      - name: Byte-compile every tracked .py
        # Catches a syntax error in a file no test imports, which a suite that
        # only covers imported modules would never notice.
        run: python -m py_compile $(git ls-files '*.py')

  frontend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        # The pytest job above covers Python and nothing else, which is how a
        # merge conflict resolved to a stray `</tbody>` in a JSX table reached
        # `main` with a green PR: no Python test imports a component, so the
        # suite passed and the build broke. `tsc -b` is the same trick as the
        # py_compile step above — it checks files no test exercises.
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        # Added once the six failures that blocked this are fixed: the suite is
        # green on `main` (240 tests, 28 files), so the gate can run without
        # hiding the type errors above. `tsc -b` checks types, not behaviour --
        # the two GameDetailModal heading tests that regressed were green under
        # `tsc -b` and caught only here.
        working-directory: frontend
        run: npm test