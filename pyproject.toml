[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nba-predictor"
version = "0.1.0"
description = "NBA game outcome and player prop prediction system"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "optuna>=4.0",
    "nba_api>=1.5",
    "requests>=2.32",
    # Runtime, not dev when api/explain.py imported httpx to reach the explainer.
    # That proxy is gone (nba is refused by the explainer, so it could only 502),
    # and httpx is no longer imported anywhere in src/ -- which
    # tests/test_runtime_dependencies.py now asserts. The dependency is kept: the
    # tests need it, and dropping a declared runtime dep is a separate change
    # with an image-build risk that cannot be checked from here.
    # service, and a Docker image installs only [project].dependencies. With
    # httpx dev-only the image died on import on the VPS while every test
    # passed, because the test tooling pulls httpx in anyway.
    "httpx>=0.27",
    # schemas.py imports pydantic directly. It arrives transitively via
    # fastapi today, but a direct import should be a direct declaration.
    "pydantic>=2.9",
    # app.py imports starlette directly (HTTPException, Scope). Also transitive
    # via fastapi today, but a direct import should be a direct declaration.
    "starlette>=0.41",
    "tenacity>=8.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nba_predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
